<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sales &amp; Docs Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #12151a;
    --panel: #191d24;
    --border: #262b34;
    --text: #e7e9ec;
    --text-dim: #8b93a1;
    --sql-color: #5eead4;
    --sql-bg: rgba(94, 234, 212, 0.1);
    --docs-color: #fbbf24;
    --docs-bg: rgba(251, 191, 36, 0.1);
    --user-bg: #262b34;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 20px 24px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    gap: 12px;
  }

  header h1 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 15px;
    font-weight: 700;
    margin: 0;
    letter-spacing: 0.02em;
  }

  header .sub {
    font-size: 12px;
    color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace;
  }

  .legend {
    margin-left: auto;
    display: flex;
    gap: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
  }

  .legend span {
    padding: 3px 8px;
    border-radius: 4px;
  }

  .legend .sql-tag { color: var(--sql-color); background: var(--sql-bg); }
  .legend .docs-tag { color: var(--docs-color); background: var(--docs-bg); }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .msg {
    display: flex;
    flex-direction: column;
    max-width: 78%;
  }

  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.bot { align-self: flex-start; align-items: flex-start; }

  .bubble {
    padding: 11px 15px;
    border-radius: 10px;
    font-size: 14.5px;
    line-height: 1.5;
  }

  .msg.user .bubble {
    background: var(--user-bg);
    color: var(--text);
    border-bottom-right-radius: 3px;
  }

  .msg.bot .bubble {
    background: var(--panel);
    border: 1px solid var(--border);
    border-bottom-left-radius: 3px;
  }

  .source-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 500;
    margin-bottom: 5px;
    padding: 2px 7px;
    border-radius: 4px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .source-tag.sql { color: var(--sql-color); background: var(--sql-bg); }
  .source-tag.docs { color: var(--docs-color); background: var(--docs-bg); }

  .typing {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text-dim);
  }

  form {
    display: flex;
    gap: 10px;
    padding: 16px 24px 24px;
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
  }

  input {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px 14px;
    border-radius: 8px;
    font-family: 'Inter', sans-serif;
    font-size: 14.5px;
    outline: none;
  }

  input:focus { border-color: var(--sql-color); }

  button {
    background: var(--text);
    color: var(--bg);
    border: none;
    padding: 0 20px;
    border-radius: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
  }

  button:disabled { opacity: 0.5; cursor: default; }

  #chat::-webkit-scrollbar { width: 8px; }
  #chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
</style>
</head>
<body>

<header>
  <h1>SALES &amp; DOCS ASSISTANT</h1>
  <span class="sub">hybrid SQL + RAG agent</span>
  <div class="legend">
    <span class="sql-tag">● database</span>
    <span class="docs-tag">● documents</span>
  </div>
</header>

<div id="chat"></div>

<form id="chat-form">
  <input id="input" type="text" placeholder="Ask about sales, or company policies..." autocomplete="off" />
  <button id="send-btn" type="submit">Ask</button>
</form>

<script>
  const chat = document.getElementById('chat');
  const form = document.getElementById('chat-form');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send-btn');

  function addMessage(text, sender, source) {
    const msg = document.createElement('div');
    msg.className = `msg ${sender}`;

    if (sender === 'bot' && source) {
      const tag = document.createElement('div');
      tag.className = `source-tag ${source}`;
      tag.textContent = source === 'sql' ? 'database' : 'documents';
      msg.appendChild(tag);
    }

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    msg.appendChild(bubble);

    chat.appendChild(msg);
    chat.scrollTop = chat.scrollHeight;
    return msg;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const question = input.value.trim();
    if (!question) return;

    addMessage(question, 'user');
    input.value = '';
    sendBtn.disabled = true;

    const typingMsg = document.createElement('div');
    typingMsg.className = 'typing';
    typingMsg.textContent = 'thinking...';
    chat.appendChild(typingMsg);
    chat.scrollTop = chat.scrollHeight;

    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question })
      });
      const data = await res.json();
      typingMsg.remove();
      addMessage(data.answer, 'bot', data.source);
    } catch (err) {
      typingMsg.remove();
      addMessage('Something went wrong reaching the server.', 'bot', null);
    }

    sendBtn.disabled = false;
    input.focus();
  });

  input.focus();
</script>

</body>
</html>
